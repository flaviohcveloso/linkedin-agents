# Wakes the app and triggers scheduled monitoring, so it runs even when nobody has the app open.
# Needs two repository secrets: APP_URL (e.g. https://linkedin-agents.onrender.com) and CRON_TOKEN.
name: Scheduled monitoring
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the app and start a run if one is due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl -fsS --retry 8 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_TOKEN" "$APP_URL/api/cron"
          echo
          # Keep the free instance awake until the run has finished.
          for i in $(seq 1 30); do
            sleep 20
            status=$(curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_TOKEN" "$APP_URL/api/cron/status" || true)
            echo "$status"
            echo "$status" | grep -q '"running": \[\]' && break
          done
